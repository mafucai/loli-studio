name: loli-studio APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build release APK
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleRelease
      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/loli-studio-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:${KEYSTORE_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --key-pass "pass:${KEYSTORE_PASS}" \
            --out "${SIGNED}" "${UNSIGNED}"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "${SIGNED}"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/loli-studio-release.apk"
          test -s "${APK}"
          unzip -tq "${APK}"
          sha256sum "${APK}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: loli-studio-apk
          path: app/build/outputs/apk/release/loli-studio-release.apk
          if-no-files-found: error
