name: loli-studio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已下架 'tools' 包（默认值含它会导致 Failed to find package 'tools'）
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleRelease

      - name: Sign release APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS_NAME: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"

          # 1) 先发现实际产物名，不猜测
          echo "=== release 产物清单 ==="
          find app/build/outputs/apk/release -type f -name '*.apk' -print
          UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*-unsigned.apk' -print -quit)"
          if [ -z "${UNSIGNED}" ]; then
            UNSIGNED="$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          fi
          test -n "${UNSIGNED}"
          test -f "${UNSIGNED}"
          echo "选定产物: ${UNSIGNED}"
          SIGNED="app/build/outputs/apk/release/lolistudio-release.apk"

          # 2) Secrets 有效则用固定签名；为空或无效（base64 坏/空文件）则回退临时 keystore
          #    关键：坏 secret 不能杀死整个流程（旧版 test -s 失败会 set -e 退出，见 run 36231445728）
          USE_FIXED=0
          if [ -n "${KEYSTORE_B64:-}" ] \
             && printf '%s' "${KEYSTORE_B64}" | base64 -d > release-fixed.jks 2>/dev/null \
             && [ -s release-fixed.jks ]; then
            USE_FIXED=1
          fi

          if [ "${USE_FIXED}" = "1" ]; then
            echo "使用 Secrets 中的固定签名（可覆盖安装）"
            KS_PASS="${KEYSTORE_PASS}"
            KS_ALIAS="${KEYSTORE_ALIAS_NAME}"
            KS_KEYPASS="${KEY_PASS:-${KEYSTORE_PASSWORD}}"
          else
            echo "::warning::KEYSTORE_BASE64 为空或无效，回退临时 keystore（验证包，不能覆盖安装正式包）"
            KS_PASS="android"
            KS_ALIAS="androiddebugkey"
            KS_KEYPASS="android"
            keytool -genkeypair -v -keystore release-temp.jks \
              -alias "${KS_ALIAS}" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KS_PASS}" -keypass "${KS_KEYPASS}" \
              -dname "CN=LoliStudio, OU=CI, O=CI, L=CI, S=CI, C=CN" > /dev/null 2>&1
            cp release-temp.jks release-fixed.jks
            test -s release-fixed.jks
          fi

          # 3) 签名 + 验证
          "${BT}/apksigner" sign \
            --ks release-fixed.jks --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KS_ALIAS}" \
            --key-pass "pass:${KS_KEYPASS}" --out "${SIGNED}" "${UNSIGNED}"
          "${BT}/apksigner" verify "${SIGNED}"
          "${BT}/apksigner" verify --print-certs "${SIGNED}" | head -4

          # 4) 构建后 APK 级验证
          stat -c '%s bytes %n' "${SIGNED}"
          unzip -tq "${SIGNED}"
          sha256sum "${SIGNED}"

          rm -f release-fixed.jks release-temp.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lolistudio-apk
          path: app/build/outputs/apk/release/lolistudio-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          APK="app/build/outputs/apk/release/lolistudio-release.apk"
          # 发 Release 属锦上添花：失败不拖垮整个 job（APK 已在 artifact 里）
          if gh release create "${TAG}" "${APK}" \
               --repo "${GITHUB_REPOSITORY}" \
               --title "洛丽塔工坊 ${TAG}" \
               --notes "洛丽塔工坊 Android 版 — 云端构建 APK。含 WebView 错误回调链路（onReceivedError / onConsoleMessage / onRenderProcessGone）+ main.js 双通道上报。"; then
            echo "Release ${TAG} 已发布"
          else
            echo "::warning::Release 发布失败（tag 可能已存在），APK 仍在 artifact 中可下载"
          fi
