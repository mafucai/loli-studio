name: loli-studio-browser-acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  browser-acceptance:
    name: Playwright · 真实点击验收
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright pytest
          playwright install --with-deps chromium

      - name: Preflight（静态断言 + JS 语法检查）
        run: |
          echo "===== JS 语法检查（node --check） ====="
          for f in prototype/js/core/*.js; do
            node --check "$f" || (echo "语法错误：$f" && exit 1)
            echo "  ✅ $f"
          done

          echo
          echo "===== 蓝图断言（scripts/ui-regression.js） ====="
          node scripts/ui-regression.js

          echo
          echo "===== 端到端数据链路（scripts/e2e-data.js） ====="
          node scripts/e2e-data.js

      - name: 启动本地 HTTP 服务
        run: |
          cd prototype
          python3 -m http.server 8765 --bind 127.0.0.1 &
          echo $! > /tmp/http.pid
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html -o /dev/null
          echo "✅ HTTP 服务就绪"

      - name: Playwright 真实点击 · 走完九步 + 历史 + 接口设置
        run: |
          pip install playwright
          cat > /tmp/test_flow.py <<'PYEOF'
import asyncio, json, os, sys
from playwright.async_api import async_playwright

URL = "http://127.0.0.1:8765/index.html"
OUT = "test-results"
os.makedirs(OUT, exist_ok=True)

async def main():
    async with async_playwright() as p:
        browser = await p.chromium.launch(headless=True)
        ctx = await browser.new_context(viewport={"width": 390, "height": 844}, device_scale_factor=2)
        page = await ctx.new_page()

        errors = []
        page.on("console", lambda m: errors.append(f"[{m.type}] {m.text}") if m.type in ("error","warning") else None)
        page.on("pageerror", lambda e: errors.append(f"[pageerror] {e}"))

        def save(name):
            page.screenshot(path=f"{OUT}/{name}.png", full_page=True)
            print(f"  📸 {OUT}/{name}.png")

        # 1. 首页加载
        await page.goto(URL, wait_until="domcontentloaded")
        await page.wait_for_timeout(500)
        assert await page.title() == "洛丽塔工坊 · loli-studio", "标题"
        print("  ✅ 首页加载，标题正确")

        # 2. 演示模式徽章
        badge = await page.text_content("#badge-mock")
        assert badge.strip() == "演示", f"默认应为演示模式，实际：{badge}"
        print("  ✅ 默认演示模式")

        # 3. 底部 9 步全部渲染
        steps = await page.query_selector_all(".step")
        assert len(steps) == 9, f"底部应有 9 步，实际：{len(steps)}"
        print("  ✅ 底部 9 步导航")

        # 4. 当前是「设计词」
        title = await page.text_content("#title")
        assert title.strip() == "设计词", f"当前标题：{title}"

        # 5. 填设计词 → 生成
        await page.fill("#in-prompt", "雾霾蓝英式下午茶 春夏薄款 甜美日常 蝴蝶结收腰")
        await page.click('[data-act="gen-words"]')
        await page.wait_for_timeout(300)
        body = await page.inner_text("#view")
        assert "风格" in body and "面料" in body, "生成设计词后应有结构化输出"
        print("  ✅ 生成设计词")
        save("01-words")

        # 6. 下一步：出图
        await page.click('[data-act="next"][data-step="img"]')
        await page.wait_for_timeout(300)
        await page.click('[data-act="gen-img"]')
        await page.wait_for_timeout(300)
        img = await page.query_selector("#view img.card-img")
        assert img, "出图后应有 img 元素"
        src = await img.get_attribute("src")
        assert src.startswith("data:image/svg+xml"), f"图源应为本地 SVG，实际：{src[:60]}"
        print("  ✅ 出图（本地 SVG，不依赖 CDN）")

        # 7. 通过图 → 拆件
        await page.click('[data-act="pass-img"]')
        await page.wait_for_timeout(200)
        await page.click('[data-act="next"][data-step="part"]')
        await page.wait_for_timeout(300)
        await page.click('[data-act="gen-bom"]')
        await page.wait_for_timeout(300)
        tables = await page.query_selector_all("#view table")
        assert len(tables) >= 2, f"BOM 应至少 2 张表（零件+工序），实际：{len(tables)}"
        print(f"  ✅ 拆件 BOM（{len(tables)} 张表）")
        save("02-bom")

        # 8. 查重
        await page.click('[data-act="next"][data-step="check"]')
        await page.wait_for_timeout(300)
        await page.click('[data-act="run-check"]')
        await page.wait_for_timeout(300)
        rows = await page.query_selector_all("#view table tbody tr")
        assert len(rows) == 5, f"查重应扫 5 个平台，实际 {len(rows)}"
        print(f"  ✅ 查重 5 平台：{'/'.join([await r.inner_text() for r in rows])}")

        # 9. 尝试标原创（如果 pass）
        try:
            await page.click('[data-act="mark-original"]', timeout=1000)
            await page.wait_for_timeout(200)
            print("  ✅ 标原创通过")
        except Exception as e:
            print(f"  ℹ️ 未通过原创（可能判定雷同）：{e}")
            # 走完流程需要标原创，如果雷同，重跑一次查重直到 pass
            for _ in range(5):
                await page.click('[data-act="run-check"]')
                await page.wait_for_timeout(200)
                try:
                    await page.click('[data-act="mark-original"]', timeout=1000)
                    print("  ✅ 重跑后标原创")
                    break
                except:
                    pass

        # 10. 采购
        await page.click('[data-act="next"][data-step="buy"]')
        await page.wait_for_timeout(300)
        await page.click('[data-act="run-sourcing"]')
        await page.wait_for_timeout(300)
        buy_rows = await page.query_selector_all("#view table tbody tr")
        assert len(buy_rows) >= 5, f"采购应有至少 5 条，实际 {len(buy_rows)}"
        print(f"  ✅ 采购清单 {len(buy_rows)} 条")
        save("03-sourcing")

        # 11. 组合
        await page.click('[data-act="next"][data-step="look"]')
        await page.wait_for_timeout(300)
        await page.click('[data-act="gen-combo"]')
        await page.wait_for_timeout(300)
        print("  ✅ 组合实况")

        # 12. 模特
        await page.click('[data-act="next"][data-step="model"]')
        await page.wait_for_timeout(300)
        await page.click('[data-act="gen-model"]')
        await page.wait_for_timeout(300)
        model_imgs = await page.query_selector_all("#view img")
        assert len(model_imgs) >= 2, f"模特应有正/背 2 张图，实际 {len(model_imgs)}"
        print(f"  ✅ 模特 {len(model_imgs)} 张图")
        save("04-model")

        # 13. 工厂
        await page.click('[data-act="next"][data-step="fact"]')
        await page.wait_for_timeout(300)
        await page.click('[data-act="run-factories"]')
        await page.wait_for_timeout(300)
        cards = await page.query_selector_all("#view .panel.tight")
        assert len(cards) >= 5, f"工厂应有 ≥5 家，实际 {len(cards)}"
        # 选第一家
        await page.click('[data-act="pick-fact"]')
        await page.wait_for_timeout(200)
        print(f"  ✅ 工厂 {len(cards)} 家，已选一家")

        # 14. 成本
        await page.click('[data-act="next"][data-step="cost"]')
        await page.wait_for_timeout(300)
        await page.click('[data-act="run-finance"]')
        await page.wait_for_timeout(300)
        cost = await page.inner_text("#view")
        assert "成本" in cost and "毛利" in cost, "成本页应包含成本/毛利字段"
        print("  ✅ 成本利润")
        save("05-finance")

        # 15. 历史列表（刷新页面）
        await page.reload()
        await page.wait_for_timeout(300)
        await page.click("#btn-history")
        await page.wait_for_timeout(300)
        hist_items = await page.query_selector_all(".history-item")
        assert len(hist_items) >= 1, f"历史应有至少 1 条，实际 {len(hist_items)}"
        print(f"  ✅ 历史列表 {len(hist_items)} 条（刷新后可恢复）")
        save("06-history")

        # 16. 点回设计单，检查数据还在
        await page.click(".history-item")
        await page.wait_for_timeout(300)
        body_after = await page.inner_text("#view")
        # 数据应保留
        assert len(body_after) > 100, "点回设计单后数据应完整"

        # 17. 打开接口设置
        await page.click("#badge-mock")
        await page.wait_for_timeout(200)
        sheet = await page.query_selector("#sheet")
        assert await sheet.is_visible(), "点徽章应弹出接口设置"
        await page.click('[data-act="close-sheet"]')
        print("  ✅ 接口设置弹窗")

        # 18. 控制台错误检查
        hard_errors = [e for e in errors if e.startswith("[error]") or e.startswith("[pageerror]")]
        assert len(hard_errors) == 0, f"控制台有未处理错误：{hard_errors[:5]}"
        print(f"  ✅ 控制台无未处理错误（warning {len([e for e in errors if 'warning' in e])} 条）")

        await browser.close()
        print("\n===== 浏览器验收通过 =====")
        with open(f"{OUT}/console.log", "w") as f:
            for e in errors:
                f.write(e + "\n")

asyncio.run(main())
PYEOF
          python3 /tmp/test_flow.py

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            /tmp/test_flow.py
          if-no-files-found: ignore

      - name: 清理
        if: always()
        run: kill $(cat /tmp/http.pid) 2>/dev/null || true
