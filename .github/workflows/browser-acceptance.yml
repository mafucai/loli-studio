name: loli-studio-browser-acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Headless browser flow
        run: node scripts/browser-acceptance.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
          if-no-files-found: ignore
