<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12110f">
<title>洛丽塔工坊</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <button type="button" id="btn-history" class="icon-btn" aria-label="历史">历史</button>
  <div class="title"><strong>洛丽塔工坊</strong><span id="title">设计</span></div>
  <button type="button" id="badge-mock" class="icon-btn" aria-label="接口">演示</button>
</header>
<div class="progress"><i id="progress-fill"></i></div>
<main id="view"></main>
<nav id="steps" class="tabbar" aria-label="主导航"></nav>
<div id="toast" class="toast"></div>

<!-- 报错助手：常驻角标（无错误时也在，可随时点开） -->
<button type="button" id="errdot" class="errdot ok" aria-label="报错助手">✓</button>
<div id="errpanel" class="errpanel">
  <div class="errhead">
    <strong>报错助手</strong>
    <span id="errsum" class="muted">就绪</span>
    <button type="button" id="errcopy" class="errmini">复制</button>
    <button type="button" id="errclear" class="errmini">清空</button>
    <button type="button" id="errclose" class="errmini">关闭</button>
  </div>
  <div id="errbody" class="errbody"></div>
  <div class="errfoot muted" id="errfoot">未捕获到错误。故意造错可验证：见文档第 5、6 步。</div>
</div>
<div id="sheet" class="sheet">
  <div class="block">
    <h2>接口设置</h2>
    <p class="hint">文本模型和图片模型各用各的接口，互不影响。每边都能存多套，选中哪套用哪套。留空=演示模式。</p>

    <div class="ep-sec">
      <div class="ep-title">文本接口<span class="muted">（设计词、拆件说明等）</span></div>
      <div id="ep-list-text" class="ep-list"></div>
      <button type="button" class="btn" data-act="ep-add" data-kind="text">＋ 新增文本接口</button>
      <form id="form-text" class="ep-form">
        <div id="ep-empty-text" class="ep-empty muted">还没有文本接口。</div>
        <div id="ep-editor-text" class="ep-editor" style="display:none">
          <label for="in-t-name">名称</label>
          <input id="in-t-name" name="name" placeholder="例如：主力 / 备用" autocomplete="off">
          <label for="in-t-base">Base URL</label>
          <input id="in-t-base" name="base" placeholder="https://api.openai.com/v1" autocomplete="off">
          <label for="in-t-key">API Key</label>
          <input id="in-t-key" name="key" type="password" placeholder="sk-..." autocomplete="off">
          <label for="in-t-model">文本模型</label>
          <input id="in-t-model" name="model" placeholder="gpt-4o-mini" autocomplete="off">
          <button type="button" class="btn small wide" data-act="fetch-models" data-kind="text">从接口拉取模型列表</button>
          <div id="model-panel-text" class="mp" style="display:none"></div>
          <div class="actions">
            <button type="button" class="btn danger" data-act="ep-del" data-kind="text">删除这套</button>
            <button type="submit" class="btn primary">保存文本接口</button>
          </div>
        </div>
      </form>
    </div>

    <div class="ep-sec">
      <div class="ep-title">图片接口<span class="muted">（出图、组合图、模特图）</span></div>
      <div id="ep-list-image" class="ep-list"></div>
      <button type="button" class="btn" data-act="ep-add" data-kind="image">＋ 新增图片接口</button>
      <form id="form-image" class="ep-form">
        <div id="ep-empty-image" class="ep-empty muted">还没有图片接口。留空则图片用演示图。</div>
        <div id="ep-editor-image" class="ep-editor" style="display:none">
          <label for="in-i-name">名称</label>
          <input id="in-i-name" name="name" placeholder="例如：主力 / 备用" autocomplete="off">
          <label for="in-i-base">Base URL</label>
          <input id="in-i-base" name="base" placeholder="https://api.openai.com/v1" autocomplete="off">
          <label for="in-i-key">API Key</label>
          <input id="in-i-key" name="key" type="password" placeholder="sk-..." autocomplete="off">
          <label for="in-i-model">图片模型</label>
          <input id="in-i-model" name="model" placeholder="dall-e-3 / gpt-image-1" autocomplete="off">
          <button type="button" class="btn small wide" data-act="fetch-models" data-kind="image">从接口拉取模型列表</button>
          <div id="model-panel-image" class="mp" style="display:none"></div>
          <div class="actions">
            <button type="button" class="btn danger" data-act="ep-del" data-kind="image">删除这套</button>
            <button type="submit" class="btn primary">保存图片接口</button>
          </div>
        </div>
      </form>
    </div>

    <div class="actions">
      <button type="button" class="btn" data-act="close-sheet">关闭</button>
    </div>
  </div>
</div>
<script src="js/core/router.js"></script>
<script src="js/core/ai.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/factory.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/render-extra.js"></script>
<script src="js/core/settings.js"></script>
<script src="js/core/actions.js"></script>
<script src="js/core/main.js"></script>
</body>
</html>
