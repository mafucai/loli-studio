<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12110f">
<title>洛丽塔工坊</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <button type="button" id="btn-history" class="icon-btn" aria-label="历史">历史</button>
  <div class="title"><strong>洛丽塔工坊</strong><span id="title">设计</span></div>
  <button type="button" id="badge-mock" class="icon-btn" aria-label="接口">演示</button>
</header>
<div class="progress"><i id="progress-fill"></i></div>
<main id="view"></main>
<nav id="steps" class="tabbar" aria-label="主导航"></nav>
<div id="toast" class="toast"></div>

<!-- 报错助手：常驻角标（无错误时也在，可随时点开） -->
<button type="button" id="errdot" class="errdot ok" aria-label="报错助手">✓</button>
<div id="errpanel" class="errpanel">
  <div class="errhead">
    <strong>报错助手</strong>
    <span id="errsum" class="muted">就绪</span>
    <button type="button" id="errcopy" class="errmini">复制</button>
    <button type="button" id="errclear" class="errmini">清空</button>
    <button type="button" id="errclose" class="errmini">关闭</button>
  </div>
  <div id="errbody" class="errbody"></div>
  <div class="errfoot muted" id="errfoot">未捕获到错误。故意造错可验证：见文档第 5、6 步。</div>
</div>
<div id="sheet" class="sheet">
  <div class="block">
    <h2>接口设置</h2>
    <p class="hint">可保存多套地址和密钥。选中哪套，就用哪套。留空=演示模式。</p>
    <div id="ep-list" class="ep-list"></div>
    <button type="button" class="btn" data-act="ep-add" id="ep-add-btn">＋ 新增一套接口</button>
    <form id="form-settings" class="ep-form">
      <div id="ep-empty" class="ep-empty muted">还没有接口。点上面「＋ 新增一套接口」开始。</div>
      <div id="ep-editor" class="ep-editor" style="display:none">
        <label for="in-ep-name">名称（自己认得出就行）</label>
        <input id="in-ep-name" name="epName" placeholder="例如：主力 / 备用 / 便宜模型" autocomplete="off">
        <label for="in-base">Base URL</label>
        <input id="in-base" name="base" placeholder="https://api.openai.com/v1" autocomplete="off">
        <label for="in-key">API Key</label>
        <input id="in-key" name="key" type="password" placeholder="sk-..." autocomplete="off">
        <label for="in-model">文本模型</label>
        <input id="in-model" name="model" placeholder="gpt-4o-mini" autocomplete="off">
        <label for="in-image-model">图片模型</label>
        <input id="in-image-model" name="imageModel" placeholder="留空则图片继续用演示图" autocomplete="off">
        <div class="actions">
          <button type="button" class="btn danger" data-act="ep-del">删除这套</button>
          <button type="submit" class="btn primary">保存</button>
        </div>
      </div>
    </form>
    <div class="actions">
      <button type="button" class="btn" data-act="close-sheet">关闭</button>
    </div>
  </div>
</div>
<script src="js/core/router.js"></script>
<script src="js/core/ai.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/factory.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/actions.js"></script>
<script src="js/core/main.js"></script>
</body>
</html>
