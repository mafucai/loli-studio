<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12110f">
<title>洛丽塔工坊</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <button type="button" id="btn-history" class="icon-btn" aria-label="历史">历史</button>
  <div class="title"><strong>洛丽塔工坊</strong><span id="title">设计</span></div>
  <button type="button" id="badge-mock" class="icon-btn" aria-label="接口">演示</button>
</header>
<div class="progress"><i id="progress-fill"></i></div>
<main id="view"></main>
<nav id="steps" class="tabbar" aria-label="主导航"></nav>
<div id="toast" class="toast"></div>
<div id="sheet" class="sheet">
  <form id="form-settings" class="block">
    <h2>接口设置</h2>
    <p class="hint">留空就是演示模式，全部用本地数据，不联网。</p>
    <label for="in-base">Base URL</label>
    <input id="in-base" name="base" placeholder="https://api.openai.com/v1" autocomplete="off">
    <label for="in-key">API Key</label>
    <input id="in-key" name="key" type="password" placeholder="sk-..." autocomplete="off">
    <label for="in-model">文本模型</label>
    <input id="in-model" name="model" placeholder="gpt-4o-mini" autocomplete="off">
    <label for="in-image-model">图片模型</label>
    <input id="in-image-model" name="imageModel" placeholder="留空则图片继续用演示图" autocomplete="off">
    <div class="actions">
      <button type="button" class="btn" data-act="close-sheet">关闭</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</div>
<script src="js/core/router.js"></script>
<script src="js/core/ai.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/factory.js"></script>
<script src="js/core/render.js"></script>
<script src="js/core/actions.js"></script>
<script src="js/core/main.js"></script>
</body>
</html>
